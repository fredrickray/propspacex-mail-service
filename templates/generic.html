<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PropSpaceX</title>
  </head>
  <body style="margin:0;padding:0;background-color:#F4F6FB;">
    {{> header}}
        <tr>
          <td style="padding:12px 32px 8px 32px;font-family:Arial,Helvetica,sans-serif;">
            <h1 style="margin:0 0 12px 0;font-size:24px;line-height:1.3;color:#14275E;">{{#if title}}{{title}}{{else}}PropSpaceX{{/if}}</h1>
            {{#if bodyHtml}}
            <div style="font-size:15px;line-height:1.6;color:#3D4758;">{{{bodyHtml}}}</div>
            {{else}}
            <p style="margin:0;font-size:15px;line-height:1.6;color:#3D4758;">{{#if message}}{{message}}{{else}}You have a new message from PropSpaceX.{{/if}}</p>
            {{/if}}
          </td>
        </tr>
    {{> footer}}
  </body>
</html>
