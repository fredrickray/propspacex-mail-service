<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{#if title}}{{title}}{{else}}PropSpaceX notification{{/if}}</title>
  </head>
  <body style="margin:0;padding:0;background-color:#F4F6FB;">
    {{> header}}
        <tr>
          <td style="padding:12px 32px 8px 32px;font-family:Arial,Helvetica,sans-serif;">
            {{#if notificationType}}
            <p style="margin:0 0 8px 0;font-size:13px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#2563FF;">{{notificationType}}</p>
            {{/if}}
            <h1 style="margin:0 0 12px 0;font-size:24px;line-height:1.3;color:#14275E;">{{#if title}}{{title}}{{else}}Update from PropSpaceX{{/if}}</h1>
            {{#if firstName}}
            <p style="margin:0 0 12px 0;font-size:15px;line-height:1.6;color:#3D4758;">Hi {{firstName}},</p>
            {{/if}}
            <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#3D4758;">{{message}}</p>
            {{#if actionLink}}
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0;">
              <tr>
                <td style="border-radius:8px;background-color:#2563FF;">
                  <a href="{{actionLink}}" style="display:inline-block;padding:14px 28px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;">{{#if actionText}}{{actionText}}{{else}}View details{{/if}}</a>
                </td>
              </tr>
            </table>
            {{/if}}
          </td>
        </tr>
    {{> footer}}
  </body>
</html>
